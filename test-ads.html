<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test - EuroSport Spain 1 Sin Publicidad v5</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
        color: #fff;
        overflow: hidden;
      }
      .container { width: 100%; height: 100vh; display: flex; flex-direction: column; }
      .header {
        background: linear-gradient(90deg, #1a1a1a 0%, #2d2d2d 100%);
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #ff6b35;
      }
      .header h1 { font-size: 20px; color: #ff6b35; }
      .controls { display: flex; gap: 6px; }
      .mode-btn {
        padding: 6px 10px;
        background: #333;
        color: #fff;
        border: 2px solid #ff6b35;
        border-radius: 5px;
        cursor: pointer;
        font-size: 10px;
      }
      .mode-btn.active { background: #ff6b35; color: #000; }
      .video-container { flex: 1; position: relative; background: #000; margin: 15px; border-radius: 10px; }
      .video-iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
      .info-panel { padding: 8px 20px; background: #1a1a1a; border-top: 2px solid #333; font-size: 11px; color: #888; }
      .info-panel span { color: #ff6b35; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>EuroSport Spain 1 - Test JS Block</h1>
        <div class="controls">
          <button class="mode-btn active" id="mode-normal">Normal</button>
          <button class="mode-btn" id="mode-jsblock">JS Block</button>
        </div>
      </div>
      <div class="video-container">
        <iframe id="video-iframe" class="video-iframe" src="https://dlstreams.top/stream/stream-524.php" allowfullscreen></iframe>
      </div>
      <div class="info-panel">
        <strong>Modo:</strong> <span id="current-mode">Normal</span> | <span id="info-text">Sin protección</span>
      </div>
    </div>

    <script>
      const iframe = document.getElementById("video-iframe");
      const currentModeSpan = document.getElementById("current-mode");
      const infoText = document.getElementById("info-text");
      let popupCount = 0;
      let blocked = false;

      // Función para activar el bloqueo
      function activateBlock() {
        // Sobrescribir window.open
        window.open = function() {
          popupCount++;
          blocked = true;
          infoText.textContent = "⛔ Popup bloqueado #" + popupCount;
          console.log("⚠️ Popup bloqueado #" + popupCount);
          return null;
        };
        
        // Detectar cuando se intenta navegar
        let clickCount = 0;
        iframe.addEventListener("load", () => {
          clickCount = 0;
          blocked = false;
        });
      }

      document.getElementById("mode-jsblock").addEventListener("click", function() {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        currentModeSpan.textContent = "JS Block";
        infoText.textContent = "Bloqueando popups con JS";
        activateBlock();
      });

      document.getElementById("mode-normal").addEventListener("click", function() {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        currentModeSpan.textContent = "Normal";
        infoText.textContent = "Sin protección";
        location.reload();
      });
    </script>
  </body>
</html>
